<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
	<defs>
		<radialGradient id="sea" cx="42%" cy="36%" r="70%">
			<stop offset="0" stop-color="#3f8fb0"/>
			<stop offset="0.6" stop-color="#1c5878"/>
			<stop offset="1" stop-color="#0c2c44"/>
		</radialGradient>
		<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffe9a0"/>
			<stop offset="0.45" stop-color="#e0a93a"/>
			<stop offset="1" stop-color="#8a5a14"/>
		</linearGradient>
		<linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#9cc45a"/>
			<stop offset="1" stop-color="#5b8a2e"/>
		</linearGradient>
		<clipPath id="disc"><circle cx="128" cy="128" r="104"/></clipPath>
	</defs>
	<!-- Gold rim -->
	<circle cx="128" cy="128" r="122" fill="url(#gold)"/>
	<circle cx="128" cy="128" r="122" fill="none" stroke="#4a2e08" stroke-width="4"/>
	<circle cx="128" cy="128" r="106" fill="#4a2e08"/>
	<!-- The sea, with Kalimdor west and the Eastern Kingdoms east -->
	<g clip-path="url(#disc)">
		<circle cx="128" cy="128" r="104" fill="url(#sea)"/>
		<path d="M76 40c10-4 22 0 26 10s-2 18 4 26 16 10 14 22-12 14-12 26 10 18 6 32-14 18-16 32-4 28-16 30-14-14-14-26 6-22-2-32-18-8-20-22 8-22 6-34-10-16-6-28 10-14 20-18z" fill="url(#land)" stroke="#2f4a16" stroke-width="3"/>
		<path d="M168 36c12-4 26 2 30 14s-4 18 2 28-2 18-12 20-12 8-8 16 16 10 20 22-2 22 2 34-4 24-16 26-22-4-24-16 6-22 0-32-14-16-10-26 14-10 12-20-10-14-10-26 6-18 14-20z" fill="url(#land)" stroke="#2f4a16" stroke-width="3"/>
		<path d="M44 196c20 10 64 20 92 18s70-14 88-30" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="10"/>
	</g>
	<!-- A flight path from coast to coast, arriving at a marker -->
	<path d="M62 176C82 120 132 92 186 104" fill="none" stroke="#fff4d0" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 13"/>
	<circle cx="186" cy="104" r="14" fill="url(#gold)" stroke="#4a2e08" stroke-width="4"/>
	<circle cx="186" cy="104" r="5" fill="#4a2e08"/>
</svg>
