<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Storage Inspector</title>
	<link rel="icon" href="data:,">
	<link rel="stylesheet" href="/src/app/style.css">
</head>
<body>
	<header>
		<h1><a href="/">Map Explorer</a> <span class="tag">storage inspector</span></h1>
		<button id="pick" class="primary">Open World of Warcraft folder</button>
		<button id="pick-direct" title="Faster, but Chrome/Edge refuse folders under Program Files">Direct access</button>
		<input id="pick-input" type="file" webkitdirectory hidden>
		<select id="product" hidden></select>
		<button id="open" hidden>Open</button>
		<span id="status" class="muted">Pick the folder that contains <code>.build.info</code>, usually <code>C:\Program Files (x86)\World of Warcraft</code>. The browser will ask to "upload" the files; nothing leaves your computer.</span>
	</header>

	<main>
		<aside id="sidebar">
			<section id="stats-section" hidden>
				<h2>Storage</h2>
				<dl id="stats"></dl>
			</section>
			<section id="map-section" hidden>
				<h2>Map</h2>
				<div class="row">
					<select id="map"></select>
					<button id="load-map">Load</button>
				</div>
				<div class="row">
					<input id="wdt-fdid" type="number" placeholder="or WDT file ID">
				</div>
				<table id="availability"></table>
			</section>
			<section>
				<h2>Log</h2>
				<ol id="log"></ol>
			</section>
		</aside>

		<section id="overview-panel">
			<div id="overview-wrap">
				<canvas id="overview" width="0" height="0"></canvas>
				<div id="hover" hidden></div>
			</div>
			<p id="overview-hint" class="muted">Open the storage and load a map to see its tiles.</p>
		</section>

		<aside id="tile-panel" hidden>
			<h2 id="tile-title"></h2>
			<div class="images">
				<figure><canvas id="tile-heights"></canvas><figcaption>Heights (root ADT)</figcaption></figure>
				<figure><canvas id="tile-minimap"></canvas><figcaption>Minimap</figcaption></figure>
				<figure><canvas id="tile-maptexture"></canvas><figcaption>Baked map texture</figcaption></figure>
			</div>
			<dl id="tile-facts"></dl>
			<table id="tile-files"></table>
			<ul id="tile-errors" class="errors"></ul>
		</aside>
	</main>

	<script type="module" src="/src/app/inspector.ts"></script>
</body>
</html>
